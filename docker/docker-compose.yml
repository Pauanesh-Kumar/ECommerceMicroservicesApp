name: ecommerce-infra

# ================================================================
#  docker-compose.yml
#  ▸ One dedicated DB container per service
#  ▸ All secrets come from .env via env_file — never hardcoded
#  ▸ ASP.NET Core reads ConnectionStrings__UserServiceDb style vars
#  ▸ Run from the docker/ folder:  docker compose up -d
#
#  CHANGE LOG (this revision):
#   - Added postgres-order / postgres-payment (dedicated containers, same pattern
#     as postgres-user — continues the "one DB container per service" rule this
#     file already documents above). The multi-database CREATE DATABASE statements
#     for orderservice_db/paymentservice_db in 01_create_databases.sql are now
#     redundant (those DBs are created directly via each container's own
#     POSTGRES_DB env var, exactly like postgres-user does) — safe to trim that
#     script down to userservice_db only.
#   - Added productservice-api, cartservice-api, orderservice-api,
#     paymentservice-api, analyticsservice-api — reusing the EXISTING
#     mongodb-product / mongodb-analytics / redis / kafka containers, no new
#     infra containers needed for those.
#   - Added the saga Kafka topics to the existing kafka-init job (no second
#     kafka-init service — just extended the one that was already here).
#   - api-gateway gets the 5 new YARP routes/clusters as environment overrides,
#     same technique already used here for the GraphQL routes.
# ================================================================

services:

  # ──────────────────────────────────────────────────────────────
  # DATABASES — PostgreSQL (one container per service)
  # ──────────────────────────────────────────────────────────────

  postgres-user:
    image: postgres:16-alpine
    container_name: ecommerce_postgres_user
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_USER_DB}
      POSTGRES_USER:     ${POSTGRES_USER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASS}
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER} -d ${POSTGRES_USER_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-net

  postgres-order:
    image: postgres:16-alpine
    container_name: ecommerce_postgres_order
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_ORDER_DB}
      POSTGRES_USER:     ${POSTGRES_ORDER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ORDER_PASS}
    ports:
      - "5436:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ORDER_USER} -d ${POSTGRES_ORDER_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-net

  postgres-payment:
    image: postgres:16-alpine
    container_name: ecommerce_postgres_payment
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_PAYMENT_DB}
      POSTGRES_USER:     ${POSTGRES_PAYMENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PAYMENT_PASS}
    ports:
      - "5437:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PAYMENT_USER} -d ${POSTGRES_PAYMENT_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-net

  # ──────────────────────────────────────────────────────────────
  # DATABASES — MongoDB (one container per service)
  # ──────────────────────────────────────────────────────────────

  mongodb-product:
    image: mongo:7-jammy
    container_name: ecommerce_mongodb_product
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_PRODUCT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PRODUCT_PASS}
      MONGO_INITDB_DATABASE:      ${MONGO_PRODUCT_DB}
      MONGO_PRODUCT_DB:           ${MONGO_PRODUCT_DB}
      MONGO_PRODUCT_APP_USER:       ${MONGO_PRODUCT_APP_USER}
      MONGO_PRODUCT_APP_PASSWORD:   ${MONGO_PRODUCT_APP_PASSWORD}
      MONGO_PRODUCT_COLLECTION_NAME: ${MONGO_PRODUCT_COLLECTION_NAME}
    ports:
      - "${MONGO_PRODUCT_HOST_PORT}:27017"
    volumes:
      - mongodb_product_data:/data/db
      - ./init/mongo/product:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-net

  mongodb-notification:
    image: mongo:7-jammy
    container_name: ecommerce_mongodb_notification
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_NOTIF_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_NOTIF_PASS}
      MONGO_INITDB_DATABASE:      ${MONGO_NOTIF_DB}
      MONGO_NOTIF_DB:             ${MONGO_NOTIF_DB}
      MONGO_NOTIF_APP_USER:       ${MONGO_NOTIF_APP_USER}
      MONGO_NOTIF_APP_PASSWORD:   ${MONGO_NOTIF_APP_PASSWORD}
      MONGO_NOTIF_COLLECTION_NAME: ${MONGO_NOTIF_COLLECTION_NAME}
    ports:
      - "${MONGO_NOTIF_HOST_PORT}:27017"
    volumes:
      - mongodb_notification_data:/data/db
      - ./init/mongo/notification:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - notification-net

  mongodb-analytics:
    image: mongo:7-jammy
    container_name: ecommerce_mongodb_analytics
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ANALYTICS_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ANALYTICS_PASS}
      MONGO_INITDB_DATABASE:      ${MONGO_ANALYTICS_DB}
      MONGO_ANALYTICS_DB:             ${MONGO_ANALYTICS_DB}
      MONGO_ANALYTICS_APP_USER:       ${MONGO_ANALYTICS_APP_USER}
      MONGO_ANALYTICS_APP_PASSWORD:   ${MONGO_ANALYTICS_APP_PASSWORD}
      MONGO_ANALYTICS_COLLECTION_NAME: ${MONGO_ANALYTICS_COLLECTION_NAME}
    ports:
      - "${MONGO_ANALYTICS_HOST_PORT}:27017"
    volumes:
      - mongodb_analytics_data:/data/db
      - ./init/mongo/analytics:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-net

  # ──────────────────────────────────────────────────────────────
  # REDIS — shared cache (port 6379). Also backs CartService ("cart:*" key
  # prefix — never collides with UserService's "user:*" cache keys).
  # ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASS}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # ──────────────────────────────────────────────────────────────
  # KAFKA STACK
  # ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: ecommerce_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
      ZOOKEEPER_SYNC_LIMIT:  2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Mode'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ecommerce_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                                1
      KAFKA_ZOOKEEPER_CONNECT:                        zookeeper:2181
      KAFKA_LISTENERS:                                INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:                     INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:           INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:               INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:         1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:            1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                "false"
      KAFKA_NUM_PARTITIONS:                           3
      KAFKA_LOG_RETENTION_HOURS:                      168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:         0
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ecommerce-net

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ecommerce_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo 'Creating Kafka topics...'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user-updated              --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic product-stock-changed     --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-placed              --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-cancelled           --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-processed         --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user-updated.dlq          --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic product-stock-changed.dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-placed.dlq          --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-cancelled.dlq       --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-processed.dlq     --partitions 1 --replication-factor 1
        echo 'Creating fulfilment-saga Kafka topics (Product/Cart/Order/Payment/Analytics)...'
        for topic in order-created product-stock payment-requested payment-status order-confirmed order-cancelled-v2 stock-release; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic.dlq" --partitions 1 --replication-factor 1
        done
        echo 'Topics created:' && kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - ecommerce-net

  # ──────────────────────────────────────────────────────────────
  # OBSERVABILITY
  # ──────────────────────────────────────────────────────────────
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: ecommerce_kafdrop
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS:            "-Xms32M -Xmx64M"
    ports:
      - "9000:9000"
    networks:
      - ecommerce-net

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ecommerce_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE:      memory
      MEMORY_MAX_TRACES:      50000
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "4317:4317"  # OTLP gRPC
    networks:
      - ecommerce-net

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: ecommerce_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ecommerce_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ecommerce-net

  # ──────────────────────────────────────────────────────────────
  # MICROSERVICES — UserService API
  # ──────────────────────────────────────────────────────────────
  userservice-api:
    build:
      context: ..   # ECommerceMicroservicesApp root
      dockerfile: services/UserService/UserService.API/Dockerfile
    image: ecommerce/userservice-api:latest
    container_name: ecommerce_userservice_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT:               ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:                      http://+:${USERSERVICE_HOST_PORT}
      ConnectionStrings__UserServiceDb:     ${ConnectionStrings__UserServiceDb}
      Redis__ConnectionString:              ${Redis__ConnectionString}
      Kafka__BootstrapServers:              ${Kafka__BootstrapServers}
      Jwt__Key:                             ${Jwt__Key}
      Jwt__Issuer:                          ${Jwt__Issuer}
      Jwt__Audience:                        ${Jwt__Audience}
      OpenTelemetry__JaegerEndpoint:        ${OpenTelemetry__JaegerEndpoint}
      Database__MigrateOnStartup:           ${Database__MigrateOnStartup}
      Database__EnableSensitiveDataLogging: "false"
      ExternalAuth__Google__ClientId:       ${ExternalAuth__Google__ClientId}
      ExternalAuth__Google__ClientSecret:   ${ExternalAuth__Google__ClientSecret}
    ports:
      - "${USERSERVICE_HOST_PORT}:8080"
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${USERSERVICE_HOST_PORT}/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - ecommerce-net   # ✅ reaches postgres-user, redis, kafka
      - user-net        # ✅ reachable by API Gateway

  # ──────────────────────────────────────────────────────────────
  # MICROSERVICES — NotificationService API
  # ──────────────────────────────────────────────────────────────
  notification-api:
    build:
      context: ..  # ECommerceMicroservicesApp root
      dockerfile: services/NotificationService/NotificationService.API/Dockerfile
    image: ecommerce/notification-service-api:latest
    container_name: ecommerce_notification_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:        http://+:${NOTIFICATION_API_HOST_PORT}
      MongoDb__ConnectionString: >-
        mongodb://${MONGO_NOTIF_APP_USER}:${MONGO_NOTIF_APP_PASSWORD}@mongodb-notification:27017/${MONGO_NOTIF_DB}?authSource=${MONGO_NOTIF_DB}
      MongoDb__DatabaseName:   ${MONGO_NOTIF_DB}
      MongoDb__CollectionName: ${MONGO_NOTIF_COLLECTION_NAME}
      Redis__ConnectionString: ${Redis__ConnectionString}
      Kafka__BootstrapServers: ${Kafka__BootstrapServers}
      EmailSettings__ApiKey:     ${SENDGRID_API_KEY}
      EmailSettings__FromEmail:  ${SENDGRID_FROM_EMAIL}
      EmailSettings__FromName:   ${SENDGRID_FROM_NAME}
      TwilioSettings__AccountSid:      ${TWILIO_ACCOUNT_SID}
      TwilioSettings__AuthToken:       ${TWILIO_AUTH_TOKEN}
      TwilioSettings__FromPhoneNumber: ${TWILIO_FROM_NUMBER}
      Jwt__Key:      ${Jwt__Key}
      Jwt__Issuer:   ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
    ports:
      - "${NOTIFICATION_API_HOST_PORT}:8082"
    depends_on:
      mongodb-notification:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NOTIFICATION_API_HOST_PORT}/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - notification-net   # ✅ reaches mongodb-notification
      - ecommerce-net      # ✅ reaches redis, kafka

  # ──────────────────────────────────────────────────────────────
  # MICROSERVICES — ProductService API  (NEW)
  # ──────────────────────────────────────────────────────────────
  productservice-api:
    build:
      context: ..
      dockerfile: services/ProductService/ProductService.API/Dockerfile
    image: ecommerce/productservice-api:latest
    container_name: ecommerce_productservice_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:        http://+:${PRODUCTSERVICE_HOST_PORT}
      ConnectionStrings__ProductServiceDb: >-
        mongodb://${MONGO_PRODUCT_APP_USER}:${MONGO_PRODUCT_APP_PASSWORD}@mongodb-product:27017/${MONGO_PRODUCT_DB}?authSource=${MONGO_PRODUCT_DB}
      Kafka__BootstrapServers: ${Kafka__BootstrapServers}
      Jwt__Key:      ${Jwt__Key}
      Jwt__Issuer:   ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
    ports:
      - "${PRODUCTSERVICE_HOST_PORT}:8081"
    depends_on:
      mongodb-product:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PRODUCTSERVICE_HOST_PORT}/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - ecommerce-net
      - user-net

  # ──────────────────────────────────────────────────────────────
  # MICROSERVICES — CartService API  (NEW)
  # ──────────────────────────────────────────────────────────────
  cartservice-api:
    build:
      context: ..
      dockerfile: services/CartService/CartService.API/Dockerfile
    image: ecommerce/cartservice-api:latest
    container_name: ecommerce_cartservice_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:        http://+:${CARTSERVICE_HOST_PORT}
      Redis__ConnectionString: ${Redis__ConnectionString}
      Services__OrderServiceBaseUrl: http://orderservice-api:${ORDERSERVICE_HOST_PORT}
      Jwt__Key:      ${Jwt__Key}
      Jwt__Issuer:   ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
    ports:
      - "${CARTSERVICE_HOST_PORT}:8083"
    depends_on:
      redis:
        condition: service_healthy
      orderservice-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CARTSERVICE_HOST_PORT}/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-net
      - user-net

  # ──────────────────────────────────────────────────────────────
  # MICROSERVICES — OrderService API  (NEW)
  # ──────────────────────────────────────────────────────────────
  orderservice-api:
    build:
      context: ..
      dockerfile: services/OrderService/OrderService.API/Dockerfile
    image: ecommerce/orderservice-api:latest
    container_name: ecommerce_orderservice_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:        http://+:${ORDERSERVICE_HOST_PORT}
      ConnectionStrings__OrderServiceDb: ${ConnectionStrings__OrderServiceDb}
      Kafka__BootstrapServers: ${Kafka__BootstrapServers}
      Database__MigrateOnStartup: ${Database__MigrateOnStartup}
      Jwt__Key:      ${Jwt__Key}
      Jwt__Issuer:   ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
    ports:
      - "${ORDERSERVICE_HOST_PORT}:8084"
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${ORDERSERVICE_HOST_PORT}/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - ecommerce-net
      - user-net

  # ──────────────────────────────────────────────────────────────
  # MICROSERVICES — PaymentService API  (NEW)
  # ──────────────────────────────────────────────────────────────
  paymentservice-api:
    build:
      context: ..
      dockerfile: services/PaymentService/PaymentService.API/Dockerfile
    image: ecommerce/paymentservice-api:latest
    container_name: ecommerce_paymentservice_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:        http://+:${PAYMENTSERVICE_HOST_PORT}
      ConnectionStrings__PaymentServiceDb: ${ConnectionStrings__PaymentServiceDb}
      Kafka__BootstrapServers: ${Kafka__BootstrapServers}
      Razorpay__KeyId:         ${RAZORPAY_KEY_ID}
      Razorpay__KeySecret:     ${RAZORPAY_KEY_SECRET}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET}
      Jwt__Key:      ${Jwt__Key}
      Jwt__Issuer:   ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
    ports:
      - "${PAYMENTSERVICE_HOST_PORT}:8085"
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PAYMENTSERVICE_HOST_PORT}/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - ecommerce-net
      - user-net

  # ──────────────────────────────────────────────────────────────
  # MICROSERVICES — AnalyticsService API  (NEW)
  # ──────────────────────────────────────────────────────────────
  analyticsservice-api:
    build:
      context: ..
      dockerfile: services/AnalyticsService/AnalyticsService.API/Dockerfile
    image: ecommerce/analyticsservice-api:latest
    container_name: ecommerce_analyticsservice_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:        http://+:${ANALYTICSSERVICE_HOST_PORT}
      ConnectionStrings__AnalyticsServiceDb: >-
        mongodb://${MONGO_ANALYTICS_APP_USER}:${MONGO_ANALYTICS_APP_PASSWORD}@mongodb-analytics:27017/${MONGO_ANALYTICS_DB}?authSource=${MONGO_ANALYTICS_DB}
      ConnectionStrings__AnalyticsReportingDb: ${ConnectionStrings__OrderServiceDb}
      Kafka__BootstrapServers: ${Kafka__BootstrapServers}
      Jwt__Key:      ${Jwt__Key}
      Jwt__Issuer:   ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
    ports:
      - "${ANALYTICSSERVICE_HOST_PORT}:8086"
    depends_on:
      mongodb-analytics:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${ANALYTICSSERVICE_HOST_PORT}/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - ecommerce-net
      - user-net

  # ──────────────────────────────────────────────────────────────
  # MICROSERVICES — API Gateway (YARP)
  # ──────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ..
      dockerfile: gateway/ApiGateway/ApiGateway/Dockerfile
    image: ecommerce/api-gateway:latest
    container_name: ecommerce_api_gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS:        http://+:${APIGATEWAY_HOST_PORT}
      Jwt__Key:               ${Jwt__Key}
      Jwt__Issuer:            ${Jwt__Issuer}
      Jwt__Audience:          ${Jwt__Audience}
      ReverseProxy__Clusters__user-service-cluster__Destinations__primary__Address: http://userservice-api:${USERSERVICE_HOST_PORT}
      ReverseProxy__Clusters__notification-service-cluster__Destinations__primary__Address: http://notification-api:${NOTIFICATION_API_HOST_PORT}
      Services__UserServiceBaseUrl:         http://userservice-api:${USERSERVICE_HOST_PORT}
      Services__NotificationServiceBaseUrl: http://notification-api:${NOTIFICATION_API_HOST_PORT}
      # ── GraphQL routes, reusing the existing REST clusters above ──────────
      ReverseProxy__Routes__users-graphql__ClusterId: user-service-cluster
      ReverseProxy__Routes__users-graphql__Match__Path: /graphql/users
      ReverseProxy__Routes__users-graphql__Transforms__0__PathSet: /graphql
      ReverseProxy__Routes__notifications-graphql__ClusterId: notification-service-cluster
      ReverseProxy__Routes__notifications-graphql__Match__Path: /graphql/notifications
      ReverseProxy__Routes__notifications-graphql__Transforms__0__PathSet: /graphql
      # ── NEW: Product / Cart / Order / Payment / Analytics routes+clusters ──
      ReverseProxy__Routes__product-service-route__ClusterId: product-service-cluster
      ReverseProxy__Routes__product-service-route__Match__Path: /api/products/{**catch-all}
      ReverseProxy__Clusters__product-service-cluster__Destinations__primary__Address: http://productservice-api:${PRODUCTSERVICE_HOST_PORT}

      ReverseProxy__Routes__cart-service-route__ClusterId: cart-service-cluster
      ReverseProxy__Routes__cart-service-route__Match__Path: /api/cart/{**catch-all}
      ReverseProxy__Clusters__cart-service-cluster__Destinations__primary__Address: http://cartservice-api:${CARTSERVICE_HOST_PORT}

      ReverseProxy__Routes__order-service-route__ClusterId: order-service-cluster
      ReverseProxy__Routes__order-service-route__Match__Path: /api/orders/{**catch-all}
      ReverseProxy__Clusters__order-service-cluster__Destinations__primary__Address: http://orderservice-api:${ORDERSERVICE_HOST_PORT}

      # Payment webhook must stay reachable WITHOUT the gateway's JWT policy — kept
      # as its own unauthenticated route ahead of the general payment-service-route.
      ReverseProxy__Routes__payment-webhook-route__ClusterId: payment-service-cluster
      ReverseProxy__Routes__payment-webhook-route__Match__Path: /api/payments/webhooks/{**catch-all}
      ReverseProxy__Routes__payment-service-route__ClusterId: payment-service-cluster
      ReverseProxy__Routes__payment-service-route__AuthorizationPolicy: default
      ReverseProxy__Routes__payment-service-route__Match__Path: /api/payments/{**catch-all}
      ReverseProxy__Clusters__payment-service-cluster__Destinations__primary__Address: http://paymentservice-api:${PAYMENTSERVICE_HOST_PORT}

      ReverseProxy__Routes__analytics-service-route__ClusterId: analytics-service-cluster
      ReverseProxy__Routes__analytics-service-route__AuthorizationPolicy: default
      ReverseProxy__Routes__analytics-service-route__Match__Path: /api/analytics/{**catch-all}
      ReverseProxy__Clusters__analytics-service-cluster__Destinations__primary__Address: http://analyticsservice-api:${ANALYTICSSERVICE_HOST_PORT}
    ports:
      - "${APIGATEWAY_HOST_PORT}:${APIGATEWAY_HOST_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
      userservice-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      productservice-api:
        condition: service_healthy
      cartservice-api:
        condition: service_healthy
      orderservice-api:
        condition: service_healthy
      paymentservice-api:
        condition: service_healthy
      analyticsservice-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APIGATEWAY_HOST_PORT}/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ecommerce-net
      - user-net
      - notification-net

# ──────────────────────────────────────────────────────────────
# VOLUMES (one per service database)
# ──────────────────────────────────────────────────────────────
volumes:
  postgres_user_data:
  postgres_order_data:
  postgres_payment_data:
  mongodb_product_data:
  mongodb_notification_data:
  mongodb_analytics_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  prometheus_data:
  grafana_data:

# ──────────────────────────────────────────────────────────────
# NETWORKS
# ──────────────────────────────────────────────────────────────
networks:
  ecommerce-net:
    driver: bridge
  user-net:
    driver: bridge
  notification-net:
    driver: bridge
